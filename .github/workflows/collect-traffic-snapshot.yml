name: collect-traffic-snapshot

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect snapshot
        run: python3 scripts/collect.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(data): traffic snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git fetch origin main && git rebase origin/main || git rebase --abort
            git push
          fi
