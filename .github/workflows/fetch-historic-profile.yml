name: fetch-historic-profile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # 1-во число на месеца — сезонът се мести, профилът се опреснява

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/fetch_historic_profile.py
      - name: Commit
        run: |
          git config user.name "kres-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/historic_profile.json
          git diff --staged --quiet && exit 0
          git commit -m "historic profile refresh $(date -u +%FT%TZ)"
          git push
